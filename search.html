<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; background: #fff; }
  #searchPane { padding: 12px; height: 100%; box-sizing: border-box; overflow-y: auto; }
  .gsc-control-cse { padding: 0 !important; border: none !important; }

  /* page viewer: shown when a result is clicked */
  #viewerPane { display: none; height: 100%; flex-direction: column; }
  #viewerBar { padding: 8px 12px; border-bottom: 1px solid #ddd; background: #f6f6f6; }
  #backBtn { font-size: 15px; padding: 6px 14px; cursor: pointer; }
  #viewer { flex: 1; width: 100%; border: none; }
  .note { font-size: 12px; color: #666; margin-left: 10px; }
</style>

<script>
  // ===== SETTINGS =====
  const CX = "61094ca08f3294d1d";

  // Optional logging. Leave empty ("") for no logging.
  const LOG_URL = "";

  // Participant ID comes from the iframe URL: search.html?pid=XXXX&trial=3
  const params = new URLSearchParams(location.search);
  const PID = params.get("pid") || "unknown";
  const TRIAL = params.get("trial") || "";

  function log(event, detail) {
    const row = { pid: PID, trial: TRIAL, event: event, detail: detail || "",
                  time: new Date().toISOString() };
    try { window.parent.postMessage({ action: "search-log", payload: row }, "*"); } catch (e) {}
    if (LOG_URL) {
      fetch(LOG_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(row) });
    }
  }

  window.__gcse = {
    searchCallbacks: {
      web: {
        starting: function (gname, query) { log("query", query); },
        rendered: function () { log("results_shown", ""); }
      }
    }
  };

  function showViewer() {
    document.getElementById("searchPane").style.display = "none";
    document.getElementById("viewerPane").style.display = "flex";
  }
  function showResults() {
    document.getElementById("viewerPane").style.display = "none";
    document.getElementById("searchPane").style.display = "block";
    document.getElementById("viewer").src = "about:blank";
    log("back_to_results", "");
  }

  // Work out the real destination (Google sometimes swaps in a redirect link)
  function realUrl(a) {
    let url = a.getAttribute("data-ctorig") || a.href;
    try {
      const u = new URL(url);
      if (u.hostname.endsWith("google.com") && u.pathname === "/url") {
        url = u.searchParams.get("q") || u.searchParams.get("url") || url;
      }
    } catch (e) {}
    return url;
  }

  function openInViewer(url) {
    if (!url || !String(url).startsWith("http")) return;
    log("result_click", url);
    document.getElementById("viewer").src = url;
    showViewer();
  }

  // 1. Block any attempt by the search widget to open a new window
  window.open = function (url) { openInViewer(url); return null; };

  // 2. Catch clicks (and middle-clicks) on result links before Google does
  function handleLinkClick(e) {
    const a = e.target.closest("#searchPane a[href]");
    if (!a || !a.href.startsWith("http")) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    openInViewer(realUrl(a));
  }
  document.addEventListener("click", handleLinkClick, true);
  document.addEventListener("auxclick", handleLinkClick, true);

  // 3. Keep every result link pointed at the viewer, even as results re-render
  new MutationObserver(function () {
    document.querySelectorAll("#searchPane a[href]").forEach(function (a) {
      if (a.target !== "viewer") a.target = "viewer";
      a.removeAttribute("onmousedown");
    });
  }).observe(document.documentElement, { childList: true, subtree: true,
                                         attributes: true, attributeFilter: ["target", "href"] });

  log("page_loaded", "");
</script>
<script async id="cse-loader"></script>
<script>
  document.getElementById("cse-loader").src = "https://cse.google.com/cse.js?cx=" + CX;
</script>
</head>
<body>
  <div id="searchPane">
    <div class="gcse-search" data-linkTarget="viewer"></div>
  </div>

  <div id="viewerPane">
    <div id="viewerBar">
      <button id="backBtn" onclick="showResults()">&larr; Back to results</button>
      <span class="note">If this page stays blank, the site can't be shown here. Go back and choose another result.</span>
    </div>
    <iframe id="viewer" name="viewer"></iframe>
  </div>
</body>
</html>
